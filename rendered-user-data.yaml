
#cloud-config

# Define o nome da máquina.
hostname: devops-lab
manage_etc_hosts: true

# Atualiza os índices e instala as atualizações disponíveis.
package_update: true
package_upgrade: true

# Instala Docker e Nginx pelos repositórios do sistema.
packages:
  - docker.io
  - nginx

# Executa comandos após a instalação dos pacotes.
runcmd:
  # Habilita e inicia o Docker.
  - [systemctl, enable, --now, docker]

  # Habilita e inicia o servidor web Nginx.
  - [systemctl, enable, --now, nginx]
